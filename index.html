<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Eventify</title>
    <meta name="title" content="Eventify - Premium Event Planning & Venue Booking" />
    <meta name="description" content="Create unforgettable moments with Eventify. Book stunning venues, premium catering, and elegant decorations for weddings, corporate events, and celebrations in Nigeria.">
    <meta name="keywords" content="event planning, venue booking, wedding venues, corporate events, catering services, event decorations, Lagos events, Nigeria events, party planning, hall booking">
    <meta name="author" content="Eventify" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://enny-event.lovable.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enny-event.lovable.app/" />
    
    
    <meta property="og:image" content="https://enny-event.lovable.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Eventify" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://enny-event.lovable.app/" />
    
    
    <meta name="twitter:image" content="https://enny-event.lovable.app/og-image.jpg" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#d97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://storage.googleapis.com/gpt-engineer-file-uploads/LuKq9YuSKAZPZfvm0sg2BV6YmOT2/uploads/1770717470668-Screenshot_20260210_105515_WhatsApp.jpg">
    <link rel="apple-touch-icon" href="/og-image.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Eventify",
        "url": "https://enny-event.lovable.app",
        "logo": "https://enny-event.lovable.app/og-image.jpg",
        "description": "Premium event planning and venue booking service in Nigeria. We offer stunning venues, catering, and decorations for weddings, corporate events, and celebrations.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Event Street",
          "addressLocality": "Lagos",
          "addressCountry": "Nigeria"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-800-123-4567",
          "contactType": "customer service",
          "email": "hello@eventify.com"
        },
        "sameAs": [
          "https://www.instagram.com/eventify",
          "https://www.facebook.com/eventify",
          "https://www.twitter.com/eventify"
        ]
      }
    </script>
    <meta property="og:title" content="Eventify">
  <meta name="twitter:title" content="Eventify">
  <meta property="og:description" content="Create unforgettable moments with Eventify. Book stunning venues, premium catering, and elegant decorations for weddings, corporate events, and celebrations in Nigeria.">
  <meta name="twitter:description" content="Create unforgettable moments with Eventify. Book stunning venues, premium catering, and elegant decorations for weddings, corporate events, and celebrations in Nigeria.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
