<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags (per-route values are overridden by SEO component / Helmet) -->
    <title>Eventify — Premium Event Planning & Venue Booking in Nigeria</title>
    <meta name="description" content="Book stunning venues, premium catering, and elegant decorations for weddings and events across Nigeria with Eventify." />
    <meta name="keywords" content="event planning, venue booking, wedding venues, corporate events, catering, decorations, Lagos events" />
    <meta name="author" content="Eventify" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook (sitewide fallback for non-JS crawlers; Helmet overrides per route) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enny-event-space.lovable.app/" />
    <meta property="og:title" content="Eventify — Premium Event Planning & Venue Booking" />
    <meta property="og:description" content="Book stunning venues, premium catering, and elegant decorations for weddings and events across Nigeria." />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/LuKq9YuSKAZPZfvm0sg2BV6YmOT2/social-images/social-1777726001482-They_.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Eventify" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://enny-event-space.lovable.app/" />
    <meta name="twitter:title" content="Eventify — Premium Event Planning & Venue Booking" />
    <meta name="twitter:description" content="Book stunning venues, premium catering, and elegant decorations for weddings and events across Nigeria." />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/LuKq9YuSKAZPZfvm0sg2BV6YmOT2/social-images/social-1777726001482-They_.webp" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#d97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Eventify",
        "url": "https://enny-event-space.lovable.app",
        "logo": "https://enny-event-space.lovable.app/favicon.png",
        "description": "Premium event planning and venue booking service in Nigeria — venues, catering, and decorations for weddings, corporate events, and celebrations.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Event Street",
          "addressLocality": "Lagos",
          "addressCountry": "Nigeria"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-901-767-5564",
          "contactType": "customer service",
          "email": "hello@eventify.com"
        },
        "sameAs": [
          "https://www.instagram.com/eventify",
          "https://www.facebook.com/eventify",
          "https://www.twitter.com/eventify"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
